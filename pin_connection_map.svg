<svg width="980" height="660" viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <title>ESP32 brain pin connection map</title>
  <desc>ESP32 WROOM-32D center; each used GPIO wired to its peripheral.</desc>

  <!-- background -->
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>

  <!-- ===== BOARD ===== -->
  <rect x="410" y="70" width="170" height="470" rx="10" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="495" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">ESP32 WROOM-32D</text>
  <text x="495" y="558" text-anchor="middle" font-size="11" fill="#555">BRAIN</text>

  <!-- left pads -->
  <g font-family="Consolas, monospace" font-size="10.5" font-weight="700">
    <rect x="386" y="92"  width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="103" text-anchor="middle" fill="#fff">3V3</text>
    <rect x="386" y="116" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="127" text-anchor="middle" fill="#fff">GND</text>
    <rect x="386" y="182" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="193" text-anchor="middle" fill="#fff">16</text>
    <rect x="386" y="206" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="217" text-anchor="middle" fill="#fff">5</text>
    <rect x="386" y="292" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="303" text-anchor="middle" fill="#fff">19</text>
    <rect x="386" y="376" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="387" text-anchor="middle" fill="#fff">21</text>
    <rect x="386" y="400" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="411" text-anchor="middle" fill="#fff">22</text>
    <rect x="386" y="424" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="435" text-anchor="middle" fill="#fff">23</text>
    <rect x="386" y="448" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="459" text-anchor="middle" fill="#fff">4</text>
    <rect x="386" y="472" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="483" text-anchor="middle" fill="#fff">18</text>
    <rect x="386" y="496" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="399" y="507" text-anchor="middle" fill="#fff">17</text>
  </g>
  <!-- right pads -->
  <g font-family="Consolas, monospace" font-size="10.5" font-weight="700">
    <rect x="578" y="116" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="127" text-anchor="middle" fill="#fff">25</text>
    <rect x="578" y="140" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="151" text-anchor="middle" fill="#fff">26</text>
    <rect x="578" y="266" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="277" text-anchor="middle" fill="#fff">32</text>
    <rect x="578" y="290" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="301" text-anchor="middle" fill="#fff">33</text>
    <rect x="578" y="416" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="427" text-anchor="middle" fill="#fff">27</text>
    <rect x="578" y="440" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="451" text-anchor="middle" fill="#fff">14</text>
    <rect x="578" y="486" width="26" height="15" rx="2" fill="#1a1a1a"/><text x="591" y="497" text-anchor="middle" fill="#fff">13</text>
  </g>

  <!-- ===== LEFT PERIPHERALS ===== -->
  <!-- power -->
  <rect x="20" y="70" width="300" height="92" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="32" y="90" font-size="12.5" font-weight="700" fill="#1a1a1a">POWER RAILS</text>
  <rect x="32" y="100" width="13" height="10" fill="#d64545"/><text x="50" y="109" font-size="10" fill="#555">+12V &#8594; drivers VMOT</text>
  <rect x="180" y="100" width="13" height="10" fill="#e08a2e"/><text x="198" y="109" font-size="10" fill="#555">+5V &#8594; CAM, servo</text>
  <rect x="32" y="118" width="13" height="10" fill="#3b82c4"/><text x="50" y="127" font-size="10" fill="#555">+3V3 &#8594; board, A4988 logic</text>
  <rect x="32" y="136" width="13" height="10" fill="#6b7280"/><text x="50" y="145" font-size="10" fill="#555">GND &#8594; ONE common net (all)</text>

  <!-- CAM -->
  <rect x="20" y="178" width="300" height="92" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="32" y="198" font-size="12.5" font-weight="700" fill="#1a1a1a">ESP32-CAM (vision)</text>
  <text x="32" y="217" font-size="11" fill="#1a1a1a">GPIO13 (TX) &#8594; brain <tspan font-weight="700">16</tspan>   &#183;   QR data</text>
  <text x="32" y="235" font-size="11" fill="#1a1a1a">GPIO14 (trig) &#8592; brain <tspan font-weight="700">5</tspan></text>
  <text x="32" y="253" font-size="11" fill="#1a1a1a">5V &#8592; <tspan fill="#e08a2e">+5V</tspan> (+470&#181;F)   GND &#8592; <tspan fill="#6b7280">GND</tspan></text>

  <!-- servo -->
  <rect x="20" y="280" width="300" height="64" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="32" y="300" font-size="12.5" font-weight="700" fill="#1a1a1a">SG90 SERVO (gripper)</text>
  <text x="32" y="319" font-size="11" fill="#1a1a1a">PWM (orange) &#8592; <tspan font-weight="700">19</tspan></text>
  <text x="32" y="336" font-size="11" fill="#1a1a1a">red &#8592; <tspan fill="#e08a2e">+5V</tspan>    brown &#8592; <tspan fill="#6b7280">GND</tspan></text>

  <!-- endstops -->
  <rect x="20" y="358" width="300" height="162" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="32" y="378" font-size="12.5" font-weight="700" fill="#1a1a1a">ENDSTOPS SS-5GL (NC) &#215;6</text>
  <text x="32" y="399" font-size="11" fill="#1a1a1a">MIN  X&#8594;<tspan font-weight="700">21</tspan>   Y&#8594;<tspan font-weight="700">22</tspan>   Z&#8594;<tspan font-weight="700">23</tspan>   COM&#8594;<tspan fill="#6b7280">GND</tspan></text>
  <text x="32" y="421" font-size="11" fill="#1a1a1a">MAX  X&#8594;<tspan font-weight="700">4</tspan>    Y&#8594;<tspan font-weight="700">18</tspan>   Z&#8594;<tspan font-weight="700">17</tspan>   COM&#8594;<tspan fill="#6b7280">GND</tspan></text>
  <text x="32" y="443" font-size="10" fill="#555">each NC&#8594;pin, COM&#8594;GND &#183; INPUT_PULLUP, no resistors</text>
  <text x="32" y="461" font-size="10" fill="#555">broken wire = HIGH (fail-safe)</text>
  <text x="32" y="479" font-size="10" fill="#555">CAM scan trigger on GPIO5 (kept; idle-HIGH strapping)</text>

  <!-- ===== RIGHT PERIPHERALS (A4988) ===== -->
  <rect x="700" y="92" width="260" height="108" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="712" y="112" font-size="12.5" font-weight="700" fill="#1a1a1a">A4988 &#8212; X  &#8594;  NEMA17 M1</text>
  <text x="712" y="131" font-size="11" fill="#1a1a1a">STEP &#8592; <tspan font-weight="700">25</tspan>     DIR &#8592; <tspan font-weight="700">26</tspan>     EN &#8592; <tspan font-weight="700">13</tspan></text>
  <text x="712" y="150" font-size="11" fill="#1a1a1a">VMOT &#8592; <tspan fill="#d64545">+12V</tspan> (+C1)   VDD &#8592; <tspan fill="#3b82c4">+3V3</tspan></text>
  <text x="712" y="169" font-size="11" fill="#1a1a1a">RESET=SLEEP &#8594; <tspan fill="#3b82c4">+3V3</tspan>   MS1-3 &#8594; <tspan fill="#3b82c4">+3V3</tspan></text>
  <text x="712" y="188" font-size="10" fill="#555">1A,1B = coil A   &#183;   2A,2B = coil B</text>

  <rect x="700" y="242" width="260" height="108" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="712" y="262" font-size="12.5" font-weight="700" fill="#1a1a1a">A4988 &#8212; Y  &#8594;  NEMA17 M2</text>
  <text x="712" y="281" font-size="11" fill="#1a1a1a">STEP &#8592; <tspan font-weight="700">32</tspan>     DIR &#8592; <tspan font-weight="700">33</tspan>     EN &#8592; <tspan font-weight="700">13</tspan></text>
  <text x="712" y="300" font-size="11" fill="#1a1a1a">VMOT &#8592; <tspan fill="#d64545">+12V</tspan> (+C2)   VDD &#8592; <tspan fill="#3b82c4">+3V3</tspan></text>
  <text x="712" y="319" font-size="11" fill="#1a1a1a">RESET=SLEEP &#8594; <tspan fill="#3b82c4">+3V3</tspan>   MS1-3 &#8594; <tspan fill="#3b82c4">+3V3</tspan></text>
  <text x="712" y="338" font-size="10" fill="#555">1A,1B = coil A   &#183;   2A,2B = coil B</text>

  <rect x="700" y="392" width="260" height="108" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="712" y="412" font-size="12.5" font-weight="700" fill="#1a1a1a">A4988 &#8212; Z  &#8594;  NEMA17 M3</text>
  <text x="712" y="431" font-size="11" fill="#1a1a1a">STEP &#8592; <tspan font-weight="700">27</tspan>     DIR &#8592; <tspan font-weight="700">14</tspan>     EN &#8592; <tspan font-weight="700">13</tspan></text>
  <text x="712" y="450" font-size="11" fill="#1a1a1a">VMOT &#8592; <tspan fill="#d64545">+12V</tspan> (+C3)   VDD &#8592; <tspan fill="#3b82c4">+3V3</tspan></text>
  <text x="712" y="469" font-size="11" fill="#1a1a1a">RESET=SLEEP &#8594; <tspan fill="#3b82c4">+3V3</tspan>   MS1-3 &#8594; <tspan fill="#3b82c4">+3V3</tspan></text>
  <text x="712" y="488" font-size="10" fill="#555">1A,1B = coil A   &#183;   2A,2B = coil B</text>

  <!-- ===== WIRES LEFT ===== -->
  <path fill="none" stroke="#3b82c4" stroke-width="1.8" d="M386 99  C350 99  340 116 320 116"/>
  <path fill="none" stroke="#6b7280" stroke-width="1.8" d="M386 123 C350 123 340 134 320 134"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 189 C350 189 340 220 320 220"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 213 C352 213 340 235 320 235"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 299 C352 299 340 316 320 316"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 383 C352 383 340 399 320 399"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 407 C352 407 340 421 320 421"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 431 C352 431 340 443 320 443"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 455 C352 455 340 455 320 455"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 479 C352 479 340 471 320 471"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M386 503 C352 503 340 487 320 487"/>

  <!-- ===== WIRES RIGHT ===== -->
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 123 C650 123 660 125 700 125"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 147 C648 147 660 144 700 144"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 273 C650 273 660 275 700 275"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 297 C648 297 660 294 700 294"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 423 C650 423 660 425 700 425"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 447 C648 447 660 444 700 444"/>
  <!-- EN bus to all three -->
  <path fill="none" stroke="#777" stroke-width="1.6" d="M604 493 L668 493 L668 146 L668 296 L668 446"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M668 146 H700"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M668 296 H700"/>
  <path fill="none" stroke="#777" stroke-width="1.6" d="M668 446 H700"/>
  <text x="612" y="508" font-family="Consolas, monospace" font-size="9.5" fill="#555">EN 13 &#8594; A1&#183;A2&#183;A3</text>
</svg>
